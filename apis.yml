aid: thrive-global
name: Thrive Global
description: >-
  Thrive Global is the behavior-change technology company founded by Arianna
  Huffington that helps employers and healthcare organizations improve
  wellbeing through Microsteps across five daily behaviors: Connection, Food,
  Movement, Sleep, and Stress Management. Its Partner API (documented at
  developers.thriveglobal.com) serves the Thrive content library - Resets,
  stories, microsteps, challenges, learning courses, podcasts, meditations,
  soundscapes, bedtime stories, and chronic-condition programs - and an
  official MCP server at mcp.thriveglobal.com exposes user wellbeing data and
  actions to AI assistants.
