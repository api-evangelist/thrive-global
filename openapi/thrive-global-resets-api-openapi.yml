components:
  schemas:
    ResetKeyword:
      type: object
      properties:
        keyword:
          type: string
        localized:
          type: string
    ResetThumbnails:
      type: object
      description: Responsive image URLs at multiple sizes.
      properties:
        xs:
          type: string
          nullable: true
          format: uri
        sm:
          type: string
          nullable: true
          format: uri
        md:
          type: string
          nullable: true
          format: uri
        lg:
          type: string
          nullable: true
          format: uri
        xl:
          type: string
          nullable: true
          format: uri
    ResetItem:
      type: object
      description: A Thrive Reset video.
      required:
      - id
      - name
      - resetType
      - durationInSeconds
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        resetType:
          type: string
          description: e.g. THRIVE_RESET_LONG, THRIVE_RESET_SHORT
        durationInSeconds:
          type: integer
        locale:
          type: string
        partner:
          type: string
          nullable: true
        landscape:
          $ref: '#/components/schemas/ResetOrientation'
        portrait:
          $ref: '#/components/schemas/ResetOrientation'
        manifestUrl:
          type: string
          nullable: true
          format: uri
          description: HLS manifest URL (.m3u8) for the landscape video
        thumbnail:
          type: string
          nullable: true
          format: uri
          description: Thumbnail image URL
        url:
          type: string
          nullable: true
          format: uri
          description: Embeddable player URL for the landscape video; matches `landscape.iframe`
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ResetTheme'
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/ResetKeyword'
        cmsTags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        tags:
          type: array
          items:
            oneOf:
            - type: string
            - $ref: '#/components/schemas/TaxonomyTerm'
          description: On v2 and v3, always term objects. On v1, plain tag strings for most resets, term objects otherwise. The v1 endpoint also omits `durationInSeconds`/`locale`.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions associated with this reset. Currently always empty.
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Core health behaviors associated with this reset. Currently always empty.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - message
      - valid
      properties:
        message:
          type: string
        valid:
          type: boolean
          example: false
    AudioResetItem:
      type: object
      description: An audio Thrive Reset.
      required:
      - id
      - title
      - url
      - durationInSeconds
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        durationInSeconds:
          type: integer
        url:
          type: string
          format: uri
          description: Direct MP3 URL
        order:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResetTheme:
      type: object
      properties:
        theme:
          type: string
        localized:
          type: string
        toThriveResetTag:
          type: string
          nullable: true
        toLocalizedThriveResetTag:
          type: object
          nullable: true
          properties:
            localized:
              type: string
            value:
              type: string
    ResetOrientation:
      type: object
      description: Video orientation (landscape or portrait) with iframe URL, thumbnail, and optional HLS manifest.
      properties:
        iframe:
          type: string
          nullable: true
          description: Player embed URL
        thumbnail:
          type: string
          nullable: true
          description: Thumbnail image URL
        manifest:
          type: string
          nullable: true
          description: HLS manifest URL (.m3u8)
        thumbnails:
          $ref: '#/components/schemas/ResetThumbnails'
    TaxonomyTerm:
      type: object
      description: One shape for all taxonomy layers (`tags`, `conditions`, `coreHealthBehaviors`). `id` is the durable key — persist this, not `slug`. `slug` is the kebab-case machine key used in query-parameter filters and may change if the term is renamed. `name` is the display string.
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          nullable: true
          description: Stable identifier for the term; null where none exists
        slug:
          type: string
          example: sleep
        name:
          type: string
          nullable: true
          example: Sleep
    ResetCollection:
      type: object
      description: Paginated collection of resets. Located at `data.data.reset.thrive.get` in the response.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResetItem'
        total:
          type: integer
        page:
          type: integer
        itemsPerPage:
          type: integer
        hasMore:
          type: boolean
          description: Present on v2/v3 paginated responses
    AudioResetCollection:
      type: object
      description: Paginated audio resets. Located at `data.data.reset.audio.thrive.get` in the response.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AudioResetItem'
        pageInfo:
          type: object
          properties:
            endCursor:
              type: string
              nullable: true
            hasNextPage:
              type: boolean
            hasPreviousPage:
              type: boolean
            startCursor:
              type: string
              nullable: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
