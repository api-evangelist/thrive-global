  /v1/search:
    get:
      operationId: searchContent
      tags:
      - search
      summary: Search the Thrive content library
      description: 'Search the entire Thrive content library — Resets, Stories, Microsteps, Courses, Podcasts,
        Journeys, Challenges, Soundscapes, Bedtime Stories, and Meditations — in a single request. Every
        match is returned as a complete, ready-to-render item, so there are no follow-up by-id calls to
        make.


        **Thrive Search is a premium capability of the Partner API.** To enable it for your organisation,
        contact your Thrive Global representative. Once enabled, your existing bearer token unlocks this
        endpoint automatically — no new credentials required. Requests made before Search is enabled return
        `403 Forbidden`.


        Results are returned in relevance order, capped at approximately 20 hits, and are not paginated.
        This endpoint responds with a bare `{ data: [...] }` array rather than the `{ message, valid,
        data }` envelope used by the collection endpoints.'
      security:
      - BearerAuth: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: Search text (min length 1)
        example: sleep
      - name: types
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated content types to search: reset, story, microstep, learnCourse, podcast,
          journey, challenge, soundscape, bedtime-story, meditation. Omitted = all ten. An unknown value
          returns 422.'
        example: reset,podcast,soundscape
      - name: locale
        in: query
        required: false
        schema:
          type: string
          default: en-US
        description: Locale, forwarded as the thrive-locale header
      responses:
        '200':
          description: Search results in relevance order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResultItem'
        '401':
          description: Unauthorized — missing, invalid, or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden — Thrive Search is not enabled for your account. Contact your Thrive
            Global representative to enable it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
        '422':
          description: Invalid query parameters (e.g. unknown type, missing query)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
