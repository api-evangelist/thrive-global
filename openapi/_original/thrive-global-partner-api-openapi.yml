        weeks:
          type: array
          items:
            $ref: '#/components/schemas/ProgramWeek'
paths:
  /v1/auth:
    post:
      operationId: authenticatePartner
      tags:
      - auth
      summary: Authenticate and obtain a bearer token
      description: Exchange your API key for a JWT bearer token. Optionally provide a userId.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: User identifier. Defaults to SmokeTestUser if omitted.
                  example: thrive:developerPortalTest:1709740800
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logMeWith:
                        type: object
                        properties:
                          partner:
                            type: object
                            properties:
                              token:
                                type: string
                                description: JWT bearer token (valid for 12 hours)
        '400':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid API key or authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Company validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v3/resets:
    get:
      operationId: getThriveResetsV3
      tags:
      - resets
      summary: Get Thrive Resets with pagination, locale, search, and filters
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number
      - name: limit
        in: query
        schema:
          type: integer
          default: 200
        description: Items per page
      - name: locale
        in: query
        schema:
          type: string
          default: en
        description: Language locale (e.g. en, es, en-GB)
      - name: search
        in: query
        schema:
          type: string
        description: Search resets by name
      - name: random
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Set to "true" for random ordering
      - name: theme
        in: query
        schema:
          type: string
        description: Comma-separated theme filter
      - name: tag
        in: query
        schema:
          type: string
        description: Comma-separated keyword/tag filter
      - name: sort
        in: query
        schema:
          type: string
        description: Sort order
      - name: filter
        in: query
        schema:
          type: string
        description: JSON filter object (merged with individual filter params)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  valid:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset:
                            type: object
                            properties:
                              thrive:
                                type: object
                                properties:
                                  get:
                                    $ref: '#/components/schemas/ResetCollection'
        '401':
          description: Unauthorized — missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/resets:
    get:
      operationId: getAllResetsV2
      tags:
      - resets
      summary: Get all Thrive Resets (v2) with locale support
      security:
