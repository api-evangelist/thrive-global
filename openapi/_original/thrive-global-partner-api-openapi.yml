  /v1/programs/{programId}:
    get:
      operationId: getProgram
      tags:
      - programs
      summary: Get a chronic condition program with weekly content
      description: Returns the full program structure with weekly content items. Each item has a `contentType`
        discriminator (article, roleModel, recipe, reset, microstep, lesson). Currently supports the GLP-1
        Companion program.
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: programId
        required: true
        schema:
          type: string
          enum:
          - glp1
        description: Program identifier
        example: glp1
      - in: query
        name: locale
        schema:
          type: string
          default: en-US
        description: Content locale
      - in: query
        name: week
        schema:
          type: integer
          minimum: 0
          maximum: 51
        description: Return a single week (0-indexed, 0 = welcome). Omit for all 52 weeks.
        example: 0
      - in: query
        name: contentTypes
        schema:
          type: string
        description: Comma-separated content types to include. Omit for all.
        example: article,reset,microstep
      responses:
        '200':
          description: Program retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProgramResponse'
        '404':
          description: Program not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/soundscapes:
    get:
      operationId: listSoundscapes
      tags:
      - audio experiences
      summary: List soundscapes
      description: Returns a paginated list of soundscapes — ambient audio tracks such as rainfall, ocean
        waves, and forest sounds that support focus, relaxation, and sleep. Each soundscape includes its
        playable audio, duration, imagery, captions where available, and tags.
      security:
      - BearerAuth: []
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Zero-based item offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: Page size. Values above 100 are clamped to 100, not rejected; `meta.pagination` reports
          the applied value.
      - name: locale
        in: query
        required: false
        schema:
          type: string
          default: en-US
        description: Locale, forwarded as the thrive-locale header
      responses:
        '200':
          description: A page of soundscapes
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SoundscapeItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '401':
          description: Unauthorized — missing, invalid, or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        '422':
          description: Invalid query parameters (e.g. negative offset, zero limit)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
        '502':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Service temporarily unavailable
