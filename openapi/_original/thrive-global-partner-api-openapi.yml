openapi: 3.0.0
info:
  title: Thrive Global Partner API
  description: 'API for accessing Thrive Global content and features. All content endpoints require a
    Bearer token obtained via the authentication endpoint.


    Response envelopes follow the pattern `{ message, valid, data }` where `data` contains the response
    payload. Collection endpoints nest items at a resource-specific path (e.g. `data.data.reset.thrive.get.items`).'
  version: 1.7.0
  contact:
    name: Thrive Global
    url: https://thriveglobal.com/contact/sales
servers:
- url: https://partners-api.thriveglobal.com
  description: Production server
- url: https://partners-api-stag.thriveglobal.com
  description: Staging server
tags:
- name: auth
  description: Partner authentication
- name: resets
  description: Thrive Reset video and audio content
- name: stories
  description: Articles, role model stories, and recipes
- name: content
  description: Microsteps, challenges, courses, podcasts, and journey videos
- name: programs
  description: Chronic condition programs (e.g. GLP-1 Companion)
- name: search
  description: Search the full Thrive content library (premium capability — contact your Thrive Global
    representative to enable)
- name: audio experiences
  description: Ambient soundscapes and narrated bedtime stories — audio for focus, relaxation, and sleep
- name: meditations
  description: Guided meditations — video sessions for relaxation, sleep, and stress management
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - message
      - valid
      properties:
        message:
          type: string
        valid:
          type: boolean
          example: false
    SearchResultItem:
      type: object
      description: A search result. Items of type `soundscape`, `bedtime-story`, or `meditation` carry
        the same fields as SoundscapeItem / BedtimeStoryItem / MeditationItem plus `snippet`, without
        `media` and without the `title`/`mediaType` fields. Other types carry the base fields below; additional
        fields depend on `type` (e.g. a reset carries manifestUrl/themes, a podcast carries summary).
        Every result carries the taxonomy fields `tags`/`conditions`/`coreHealthBehaviors` as term objects
        (empty arrays where no values apply). Search items deliberately omit `createdAt`/`updatedAt` for
        a consistent shape across types — use the dedicated by-id endpoint when you need timestamps.
      required:
      - id
      - type
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - reset
          - story
          - microstep
          - learnCourse
          - podcast
          - journey
          - challenge
          - soundscape
          - bedtime-story
          - meditation
        mediaType:
          type: string
          enum:
          - AUDIO
          - TEXT
          - VIDEO
          description: Absent on soundscape, bedtime-story, and meditation items
        title:
          type: string
          description: Absent on soundscape, bedtime-story, and meditation items (use `name`)
        snippet:
          type: string
          nullable: true
          description: Matched text, highlight markup stripped
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Tags as term objects; may be empty.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions as term objects; empty for most types today.
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Core health behaviors as term objects; populated for challenges (from journeys),
            empty for most other types today.
      additionalProperties: true
    TaxonomyTerm:
      type: object
      description: One shape for all taxonomy layers (`tags`, `conditions`, `coreHealthBehaviors`). `id`
        is the durable key — persist this, not `slug`. `slug` is the kebab-case machine key used in query-parameter
        filters and may change if the term is renamed. `name` is the display string.
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          nullable: true
          description: Stable identifier for the term; null where none exists
        slug:
          type: string
          example: sleep
        name:
          type: string
          nullable: true
          example: Sleep
    MediaEntry:
      type: object
      description: A playable rendition. No entry means the rendition does not exist — never null placeholders.
      required:
      - kind
      - orientation
      - contentType
      - url
      properties:
        kind:
          type: string
          enum:
          - file
          - manifest
          - embed
        orientation:
          type: string
          enum:
          - landscape
          - portrait
          nullable: true
        contentType:
          type: string
          nullable: true
          example: audio/mpeg
          description: MIME type where known
        url:
          type: string
          format: uri
    AssetEntry:
      type: object
      description: 'A supporting file: images, thumbnails, captions, transcripts.'
      required:
      - role
      - contentType
      - url
      - alt
      properties:
        role:
          type: string
          enum:
          - captions
          - transcript
          - image-landscape
          - image-portrait
          - thumbnail-landscape
          - thumbnail-portrait
          - image-featured
        contentType:
          type: string
          nullable: true
          example: image/jpeg
        url:
          type: string
          format: uri
        alt:
          type: string
          nullable: true
        sizes:
          type: object
          additionalProperties:
            type: string
          description: Explicit size-variant URLs where they exist. Never derive variants by transforming
            URLs.
    PaginationMeta:
      type: object
      description: Applied pagination values — after defaulting and clamping, not what was requested.
      required:
      - pagination
      properties:
        pagination:
          type: object
          required:
          - offset
          - limit
          - total
          properties:
            offset:
              type: integer
              example: 0
            limit:
              type: integer
              example: 10
            total:
              type: integer
              nullable: true
              description: Best-effort display data; null when a total is not available. `links.next !=
                null` is the authoritative "more results exist" signal.
    PaginationLinks:
      type: object
      description: Opaque pagination URLs — follow `next` until it is null; do not parse them. All three
        attributes are always present (null when there is no such page).
      required:
      - self
      - next
      - prev
      properties:
        self:
          type: string
          example: /v1/soundscapes?offset=0&limit=10
        next:
          type: string
          nullable: true
          example: /v1/soundscapes?offset=10&limit=10
        prev:
          type: string
          nullable: true
          example: null
    SoundscapeItem:
      type: object
      description: A soundscape — an ambient audio track that supports focus, relaxation, and sleep.
      required:
      - id
      - type
      - name
      - description
      - createdAt
      - updatedAt
      - locale
      - tags
      - conditions
      - coreHealthBehaviors
      - durationInSeconds
      - media
      - assets
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - soundscape
        name:
          type: string
          example: Forest Rain
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        locale:
          type: string
          nullable: true
          description: Served locale, not request echo
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        durationInSeconds:
          type: integer
          nullable: true
          example: 600
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaEntry'
          description: Playable renditions — the soundscape audio file
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetEntry'
          description: Supporting files — captions and imagery
    BedtimeStoryItem:
      type: object
      description: A bedtime story — a narrated audio story that helps listeners unwind and fall asleep.
      required:
      - id
      - type
      - name
      - description
      - createdAt
      - updatedAt
      - locale
      - tags
      - conditions
      - coreHealthBehaviors
      - durationInSeconds
      - media
      - assets
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - bedtime-story
        name:
          type: string
          example: The Sleepy Lighthouse
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        locale:
          type: string
          nullable: true
          description: Served locale, not request echo
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        durationInSeconds:
          type: integer
          example: 1200
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaEntry'
          description: Playable renditions — the bedtime story audio file
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetEntry'
          description: Supporting files — captions and imagery
    MeditationItem:
      type: object
      description: A meditation — a guided video session for relaxation, sleep, and stress management.
      required:
      - id
      - type
      - name
      - description
      - createdAt
      - updatedAt
      - locale
      - tags
      - conditions
      - coreHealthBehaviors
      - durationInSeconds
      - media
      - assets
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - meditation
        name:
          type: string
          example: Body Scan for Deep Rest
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        locale:
          type: string
          nullable: true
          description: Served locale, not request echo
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        durationInSeconds:
          type: integer
          example: 540
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaEntry'
          description: Playable renditions of the meditation video, keyed by `kind`.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetEntry'
          description: Supporting files — captions and imagery
    ResetThumbnails:
      type: object
      description: Responsive image URLs at multiple sizes.
      properties:
        xs:
          type: string
          nullable: true
          format: uri
        sm:
          type: string
          nullable: true
          format: uri
        md:
          type: string
          nullable: true
          format: uri
        lg:
          type: string
          nullable: true
          format: uri
        xl:
          type: string
          nullable: true
          format: uri
    ResetOrientation:
      type: object
      description: Video orientation (landscape or portrait) with iframe URL, thumbnail, and optional
        HLS manifest.
      properties:
        iframe:
          type: string
          nullable: true
          description: Player embed URL
        thumbnail:
          type: string
          nullable: true
          description: Thumbnail image URL
        manifest:
          type: string
          nullable: true
          description: HLS manifest URL (.m3u8)
        thumbnails:
          $ref: '#/components/schemas/ResetThumbnails'
    ResetTheme:
      type: object
      properties:
        theme:
          type: string
        localized:
          type: string
        toThriveResetTag:
          type: string
          nullable: true
        toLocalizedThriveResetTag:
          type: object
          nullable: true
          properties:
            localized:
              type: string
            value:
              type: string
    ResetKeyword:
      type: object
      properties:
        keyword:
          type: string
        localized:
          type: string
    ResetItem:
      type: object
      description: A Thrive Reset video.
      required:
      - id
      - name
      - resetType
      - durationInSeconds
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        resetType:
          type: string
          description: e.g. THRIVE_RESET_LONG, THRIVE_RESET_SHORT
        durationInSeconds:
          type: integer
        locale:
          type: string
        partner:
          type: string
          nullable: true
        landscape:
          $ref: '#/components/schemas/ResetOrientation'
        portrait:
          $ref: '#/components/schemas/ResetOrientation'
        manifestUrl:
          type: string
          nullable: true
          format: uri
          description: HLS manifest URL (.m3u8) for the landscape video
        thumbnail:
          type: string
          nullable: true
          format: uri
          description: Thumbnail image URL
        url:
          type: string
          nullable: true
          format: uri
          description: Embeddable player URL for the landscape video; matches `landscape.iframe`
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ResetTheme'
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/ResetKeyword'
        cmsTags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        tags:
          type: array
          items:
            oneOf:
            - type: string
            - $ref: '#/components/schemas/TaxonomyTerm'
          description: On v2 and v3, always term objects. On v1, plain tag strings for most resets, term
            objects otherwise. The v1 endpoint also omits `durationInSeconds`/`locale`.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions associated with this reset. Currently always empty.
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Core health behaviors associated with this reset. Currently always empty.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResetCollection:
      type: object
      description: Paginated collection of resets. Located at `data.data.reset.thrive.get` in the response.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResetItem'
        total:
          type: integer
        page:
          type: integer
        itemsPerPage:
          type: integer
        hasMore:
          type: boolean
          description: Present on v2/v3 paginated responses
    AudioResetItem:
      type: object
      description: An audio Thrive Reset.
      required:
      - id
      - title
      - url
      - durationInSeconds
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        durationInSeconds:
          type: integer
        url:
          type: string
          format: uri
          description: Direct MP3 URL
        order:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AudioResetCollection:
      type: object
      description: Paginated audio resets. Located at `data.data.reset.audio.thrive.get` in the response.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AudioResetItem'
        pageInfo:
          type: object
          properties:
            endCursor:
              type: string
              nullable: true
            hasNextPage:
              type: boolean
            hasPreviousPage:
              type: boolean
            startCursor:
              type: string
              nullable: true
    ArticleAuthor:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          format: uri
    ArticleCondition:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ArticleJourney:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        hasMicrosteps:
          type: boolean
        image:
          type: string
          nullable: true
        coreType:
          type: string
          nullable: true
        preferredOrder:
          type: integer
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        colorPalette:
          type: object
          nullable: true
          properties:
            contrastText:
              type: string
            dark:
              type: string
            light:
              type: string
            main:
              type: string
    StoryItem:
      type: object
      description: An article, role model story, or recipe.
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
          description: HTML content
        imageUrl:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        contentType:
          type: string
          description: 'Discriminator: article, roleModel, or recipe'
        articleContentType:
          type: string
          description: e.g. Text, Video, Audio
        durationSeconds:
          type: integer
          nullable: true
        language:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: HLS source URL for video articles
        authors:
          type: array
          items:
            $ref: '#/components/schemas/ArticleAuthor'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Tags associated with this story, as term objects.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions associated with this story, as term objects.
        journeyIds:
          type: array
          items:
            type: string
            format: uuid
        journeys:
          type: array
          items:
            $ref: '#/components/schemas/ArticleJourney'
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/ArticleJourney'
          description: Core health behaviors associated with this story; contains the same values as `journeys`.
        spotlightSubscriptionIds:
          type: array
          items:
            type: string
        featuredSubscriptionIds:
          type: array
          items:
            type: string
        seoDescription:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        imageAlternativeText:
          type: string
          nullable: true
        collection:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        servings:
          type: integer
          nullable: true
          description: 'Recipe only (v3): number of servings'
        ingredients:
          type: string
          nullable: true
          description: 'Recipe only (v3): ingredients text'
        directions:
          type: string
          nullable: true
          description: 'Recipe only (v3): cooking directions'
        conditionType:
          type: string
          description: Comma-separated names of the associated conditions
        isSpotlight:
          type: boolean
          description: Whether the story is spotlighted
        isFeatured:
          type: boolean
          description: True when `featuredSubscriptionIds` is non-empty
        thumbnailUrl:
          type: string
          nullable: true
          description: Thumbnail image URL; matches `imageUrl`
        excerpt:
          type: string
          nullable: true
          description: Short excerpt; matches `summary`
        author:
          type: string
          nullable: true
          description: Name of the first author
    StoryCollection:
      type: object
      description: Paginated stories. Located at `data.data.learnV2.getArticlesV2` in the response.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoryItem'
        pageSize:
          type: integer
        pageCount:
          type: integer
        page:
          type: integer
        hasMore:
          type: boolean
    MicrostepJourney:
      type: object
      properties:
        name:
          type: string
        shortName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
    MicrostepItem:
      type: object
      description: A small, science-backed daily action.
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        journeys:
          type: array
          items:
            $ref: '#/components/schemas/MicrostepJourney'
        coreHealthBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/MicrostepJourney'
          description: Core health behaviors associated with this microstep; contains the same values
            as `journeys`.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Tags associated with this microstep, as term objects.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions associated with this microstep. Currently always empty.
        createdAt:
          type: string
          format: date-time
          description: Omitted when not available
        updatedAt:
          type: string
          format: date-time
          description: Omitted when not available
    ChallengeGoal:
      type: object
      properties:
        id:
          type: string
        challengeId:
          type: string
        day:
          type: integer
        position:
          type: integer
        goalType:
          type: string
        goalSteps:
          type: integer
          nullable: true
        goalWater:
          type: integer
          nullable: true
        goalActivityMinutes:
          type: integer
          nullable: true
        url:
          type: string
          nullable: true
    ChallengeItem:
      type: object
      description: A challenge with its daily goals.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        duration:
          type: integer
        goal:
          type: string
        theme:
          type: string
        challenge_type:
          type: string
        position:
          type: integer
        goals:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeGoal'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Tags associated with this challenge. Currently always empty.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
          description: Health conditions associated with this challenge. Currently always empty.
        coreHealthBehaviors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              shortName:
                type: string
                nullable: true
          description: Core health behaviors associated with this challenge.
    CourseExpert:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
    CourseModule:
      type: object
      properties:
        id:
          type: string
        bookmarked:
          type: boolean
        byline:
          type: string
          nullable: true
        courseID:
          type: string
        displayName:
          type: string
          nullable: true
        hlsVideoLink:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        lessonID:
          type: string
        order:
          type: integer
        thumbnail:
          type: string
          nullable: true
        title:
          type: string
        type:
          type: string
        videoLink:
          type: string
          nullable: true
        videoURL:
          type: string
          nullable: true
          format: uri
          description: Absolute video URL
        manifestUrl:
          type: string
          nullable: true
          format: uri
          description: HLS manifest URL (.m3u8)
    CourseResource:
      type: object
      properties:
